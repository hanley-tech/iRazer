  - generic [ref=e103]:
    - generic [ref=e104]: FAQ
    - heading "Questions, answered" [level=2] [ref=e105]
    - generic [ref=e106]:
      - generic [ref=e107]:
        - heading "Is there a Razer Synapse for Mac?" [level=3] [ref=e108]
        - paragraph [ref=e109]: No — Razer does not make Synapse for macOS. iRazer is a free, open-source alternative that controls Razer devices natively on macOS.
      - generic [ref=e110]:
        - heading "How do I control a Razer Nommo V2 on a Mac?" [level=3] [ref=e111]
        - paragraph [ref=e112]: "Install iRazer, plug the Nommo V2 in over USB, and open the app: brightness, 10-band EQ, presets, master volume, and keep-awake work today; RGB over Bluetooth is in progress."
      - generic [ref=e113]:
        - heading "Is iRazer free?" [level=3] [ref=e114]
        - paragraph [ref=e115]: Yes — MIT-licensed and open source, with no account, subscription, or telemetry.
      - generic [ref=e116]:
        - heading "Does it need Razer Synapse installed?" [level=3] [ref=e117]
        - paragraph [ref=e118]: No. It talks to the hardware directly over USB HID and Bluetooth LE.
      - generic [ref=e119]:
        - heading "Which Macs are supported?" [level=3] [ref=e120]
        - paragraph [ref=e121]: macOS 14+ on Apple Silicon (M1/M2/M3/M4) and Intel.
      - generic [ref=e122]:
        - heading "Is it safe / does it need admin rights?" [level=3] [ref=e123]
        - paragraph [ref=e124]: It runs entirely in userspace — no kernel extension, no root. It only talks to Razer devices you plug in.
    - link "Get iRazer on GitHub →" [ref=e126] [cursor=pointer]:
      - /url: https://github.com/hanley-tech/iRazer
